<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#f6f8ef" />
    <link rel="icon" href="./assets/kenney/character_green_front.png" />
    <link rel="stylesheet" href="/src/ui.css" />
    <title>Dashline · 每日冲刺</title>
  </head>
  <body>
    <div id="boot-loading" role="status">
      <img src="./assets/kenney/character_green_front.png" alt="" />
      <div class="eyebrow">DASHLINE / 每日冲刺</div>
      <h1>下一站，快乐出发。</h1>
      <p id="loading-label">正在准备今日旅途…</p>
      <progress id="loading-progress" max="100" value="0" aria-label="素材加载进度"></progress>
    </div>
    <div id="boot-error"><div class="panel"><h2>游戏启动失败</h2><p id="boot-error-message">请检查浏览器图形能力或网络后重试。</p><button id="btn-boot-retry">重新加载</button></div></div>
    <header class="site-header">
      <a class="brand" href="./" aria-label="Dashline 每日冲刺"><img src="./assets/kenney/character_green_front.png" alt="" /><span>DASHLINE<small>每日冲刺</small></span></a>
      <div class="header-note"><span class="status-dot"></span> 每一天，一段新旅途 <span class="edition">MEADOW EDITION</span></div>
    </header>
    <main id="stage">
      <div id="game"></div>
      <div id="hud">
        <div id="flash"></div>
        <div class="hud-box" id="hud-stats"></div>
        <div class="hud-box" id="hud-meta"></div>
        <div id="journey-label"><span class="status-dot"></span><span id="theme-label">薄荷原野</span><small>DAILY RUN</small></div>
        <div class="hud-box" id="hud-hint"><kbd>空格</kbd> 轻点小跳 · 长按大跳 <span> / </span><kbd>S</kbd> 下砸 <span> / </span><kbd>D</kbd> 冲刺</div>
        <div class="hud-box" id="hud-mode">纯单机模式</div>
        <div id="combo-tag">COMBO ×2</div>
        <div id="pause-badge"><img src="./assets/icons/pause.svg" alt="" />已暂停 · 按 P / 空格继续</div>
        <div id="result"><div class="panel" id="result-panel" role="dialog" aria-modal="true" aria-label="游戏面板"></div></div>
        <div id="toast" role="status"></div>
        <nav id="tool-dock" aria-label="游戏工具">
          <button id="btn-mute" aria-label="声音开关" title="声音开关"><img src="./assets/icons/volume-2.svg" alt="" /></button>
          <button id="btn-pause" aria-label="暂停游戏" title="暂停游戏"><img src="./assets/icons/pause.svg" alt="" /></button>
          <span class="dock-divider"></span>
          <button id="btn-wardrobe" aria-label="外观衣橱" title="外观衣橱"><img src="./assets/icons/shirt.svg" alt="" /></button>
          <button id="btn-achievements" aria-label="成就荣誉" title="成就荣誉"><img src="./assets/icons/trophy.svg" alt="" /></button>
          <button id="btn-talents" aria-label="天赋强化" title="天赋强化"><img src="./assets/icons/zap.svg" alt="" /></button>
        </nav>
        <button id="btn-fs" aria-label="全屏" title="全屏"><img src="./assets/icons/expand.svg" alt="" /></button>
      </div>
    </main>
    <footer class="site-footer"><span>跳过烦恼，收集好心情。</span><span>免费素材 · Kenney <b> / </b> 进度仅保存在本机</span></footer>
    <div id="rotate-overlay"><img class="phone" src="./assets/icons/smartphone.svg" alt="" /><div class="t1">横屏，开启更宽的世界</div><div class="t2">旋转设备后即可继续冲刺</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
