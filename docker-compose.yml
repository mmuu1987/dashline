# 本地开发基础设施：仅 Postgres（api/validator 用 tsx 直接跑）
# 启动：docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: dashline-db
    environment:
      POSTGRES_USER: dashline
      POSTGRES_PASSWORD: dashline
      POSTGRES_DB: dashline
    ports:
      # 避开本机历史遗留的 5432 端口状态（wslrelay/旧规则），用高位端口
      - '55432:5432'
    volumes:
      - dashline_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dashline']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  dashline_pgdata:
